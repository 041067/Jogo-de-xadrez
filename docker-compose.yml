services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chess-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chess-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend